<p>group-customer-component works!</p>

<p>
  {{ errMessage() }}
</p>

<table border="1">

  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Email</th>
    <th>Age</th>
    <th>#</th>
  </tr>

  <tbody *ngFor="let group of customers()">

    <tr>
      <td colspan="5">
        {{ group.CustomerTypeId }} -
        {{ group.CustomerTypeName }}
      </td>
    </tr>

    <tr *ngFor="let customer of group.Customers">

      <td>
        {{ customer.Id }}
      </td>

      <td>
        {{ customer.Name }}
      </td>

      <td>
        {{ customer.Email }}
      </td>

      <td>
        {{ customer.Age }}
      </td>

      <td>
        <img
          [src]="customer.Image"
          width="100"
          height="100"
        >
      </td>

    </tr>

  </tbody>

</table>
